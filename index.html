<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 天気図プロトタイプ (画像解析＆テクスチャ版)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #1e1e24; font-family: sans-serif; }
    #ui { 
      position: absolute; top: 20px; left: 20px; color: #fff; 
      background: rgba(20, 20, 25, 0.8); padding: 20px; 
      border-radius: 12px; z-index: 10; backdrop-filter: blur(5px);
    }
    h3 { margin: 0 0 15px 0; font-size: 16px; }
    input[type=file] { margin-bottom: 15px; display: block; }
    label { display: block; margin-top: 10px; font-size: 14px; }
    input[type=range] { width: 100%; margin-top: 8px; }
    #process-canvas {
      position: absolute; bottom: 20px; right: 20px; width: 200px;
      border: 1px solid #444; z-index: 10; background: #000;
      display: none; /* デバッグ用なので通常は隠しておく */
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <h3>天気図画像から3D生成</h3>
    <input type="file" id="image-upload" accept="image/*">
    <label>
      起伏のスケール
      <input type="range" id="scale-slider" min="0" max="100" step="1" value="30">
    </label>
    <label>
      ぼかし強度 (ハイトマップの滑らかさ)
      <input type="range" id="blur-slider" min="5" max="50" step="1" value="20">
    </label>
  </div>

  <canvas id="process-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x1e1e24, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -100, 80);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    const size = 150;
    const segments = 256; 
    const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
    
    // 修正箇所：ワイヤーフレームを外し、元の画像の色が出るようにベースカラーを白に設定
    const material = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide
    });
    
    const plane = new THREE.Mesh(geometry, material);
    scene.add(plane);

    const canvas = document.getElementById('process-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    let currentImage = null;

    function processImageToHeightmap() {
      if (!currentImage) return;

      canvas.width = segments + 1;
      canvas.height = segments + 1;

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imageData.data;
      
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        
        if (brightness < 150) {
          data[i] = data[i+1] = data[i+2] = 0;
        } else {
          data[i] = data[i+1] = data[i+2] = 255;
        }
      }
      ctx.putImageData(imageData, 0, 0);

      const blurValue = document.getElementById('blur-slider').value;
      ctx.filter = `blur(${blurValue}px)`;
      ctx.drawImage(canvas, 0, 0);
      ctx.filter = 'none';

      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      data = imageData.data;
      const positions = geometry.attributes.position;
      const scale = document.getElementById('scale-slider').value;

      for (let i = 0; i < positions.count; i++) {
        const r = data[i * 4];
        const normalizedHeight = (255 - r) / 255.0; 
        positions.setZ(i, normalizedHeight * scale);
      }
      
      positions.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    document.getElementById('image-upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          
          // 修正箇所：アップロードされた画像をThree.jsのテクスチャとしてマテリアルに適用
          const texture = new THREE.Texture(img);
          texture.colorSpace = THREE.SRGBColorSpace; // 色を正確に表示
          texture.needsUpdate = true;
          material.map = texture;
          material.needsUpdate = true;
          
          processImageToHeightmap();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('scale-slider').addEventListener('input', processImageToHeightmap);
    document.getElementById('blur-slider').addEventListener('change', processImageToHeightmap);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
