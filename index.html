<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>3D 天気図プロトタイプ (画像解析版)</title>
        <style>
            body { margin: 0; overflow: hidden; background-color: #1e1e24; font-family: sans-serif; }
                #ui { 
                      position: absolute; top: 20px; left: 20px; color: #fff; 
                            background: rgba(20, 20, 25, 0.8); padding: 20px; 
                                  border-radius: 12px; z-index: 10; backdrop-filter: blur(5px);
                                      }
                                          h3 { margin: 0 0 15px 0; font-size: 16px; }
                                              input[type=file] { margin-bottom: 15px; display: block; }
                                                  label { display: block; margin-top: 10px; font-size: 14px; }
                                                      input[type=range] { width: 100%; margin-top: 8px; }
                                                          /* 解析過程を確認するためのデバッグ用Canvas（通常は非表示でよい） */
                                                              #process-canvas {
                                                                    position: absolute; bottom: 20px; right: 20px; width: 200px;
                                                                          border: 1px solid #444; z-index: 10; background: #000;
                                                                              }
                                                                                </style>
                                                                                  <script type="importmap">
                                                                                      {
                                                                                            "imports": {
                                                                                                    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                                                                                                            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
                                                                                                                  }
                                                                                                                      }
                                                                                                                        </script>
                                                                                                                        </head>
                                                                                                                        <body>
                                                                                                                          <div id="ui">
                                                                                                                              <h3>天気図画像から3D生成</h3>
                                                                                                                                  <input type="file" id="image-upload" accept="image/*">
                                                                                                                                      <label>
                                                                                                                                            起伏のスケール
                                                                                                                                                  <input type="range" id="scale-slider" min="0" max="100" step="1" value="30">
                                                                                                                                                      </label>
                                                                                                                                                          <label>
                                                                                                                                                                ぼかし強度 (ハイトマップの滑らかさ)
                                                                                                                                                                      <input type="range" id="blur-slider" min="5" max="50" step="1" value="20">
                                                                                                                                                                          </label>
                                                                                                                                                                            </div>

                                                                                                                                                                              <canvas id="process-canvas"></canvas>

                                                                                                                                                                                <script type="module">
                                                                                                                                                                                    import * as THREE from 'three';
                                                                                                                                                                                        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

                                                                                                                                                                                            // --- 1. Three.js セットアップ ---
                                                                                                                                                                                                const scene = new THREE.Scene();
                                                                                                                                                                                                    scene.fog = new THREE.FogExp2(0x1e1e24, 0.005);

                                                                                                                                                                                                        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                                                                                                                                                                                                            camera.position.set(0, -100, 80);

                                                                                                                                                                                                                const renderer = new THREE.WebGLRenderer({ antialias: true });
                                                                                                                                                                                                                    renderer.setSize(window.innerWidth, window.innerHeight);
                                                                                                                                                                                                                        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                                                                                                                                                                                                                            document.body.appendChild(renderer.domElement);

                                                                                                                                                                                                                                const controls = new OrbitControls(camera, renderer.domElement);
                                                                                                                                                                                                                                    controls.enableDamping = true;
                                                                                                                                                                                                                                        controls.maxPolarAngle = Math.PI / 2 - 0.05;

                                                                                                                                                                                                                                            // --- 2. ジオメトリとマテリアル ---
                                                                                                                                                                                                                                                const size = 150;
                                                                                                                                                                                                                                                    const segments = 256; // 画像解析の解像度に合わせるため分割数を増やす
                                                                                                                                                                                                                                                        const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                const material = new THREE.MeshBasicMaterial({
                                                                                                                                                                                                                                                                      color: 0x4CAF50,
                                                                                                                                                                                                                                                                            wireframe: true, // 起伏がわかりやすいようにワイヤーフレーム表示
                                                                                                                                                                                                                                                                                  side: THREE.DoubleSide
                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                              const plane = new THREE.Mesh(geometry, material);
                                                                                                                                                                                                                                                                                                  scene.add(plane);

                                                                                                                                                                                                                                                                                                      // --- 3. 画像解析とハイトマップ生成ロジック ---
                                                                                                                                                                                                                                                                                                          const canvas = document.getElementById('process-canvas');
                                                                                                                                                                                                                                                                                                              const ctx = canvas.getContext('2d', { willReadFrequently: true });
                                                                                                                                                                                                                                                                                                                  let currentImage = null;

                                                                                                                                                                                                                                                                                                                      function processImageToHeightmap() {
                                                                                                                                                                                                                                                                                                                            if (!currentImage) return;

                                                                                                                                                                                                                                                                                                                                  // ジオメトリの分割数に合わせてCanvasサイズを設定（ハイトマップの解像度）
                                                                                                                                                                                                                                                                                                                                        canvas.width = segments + 1;
                                                                                                                                                                                                                                                                                                                                              canvas.height = segments + 1;

                                                                                                                                                                                                                                                                                                                                                    // 白背景で塗りつぶす（初期化）
                                                                                                                                                                                                                                                                                                                                                          ctx.fillStyle = '#ffffff';
                                                                                                                                                                                                                                                                                                                                                                ctx.fillRect(0, 0, canvas.width, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                      // 1. 画像を描画
                                                                                                                                                                                                                                                                                                                                                                            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);

                                                                                                                                                                                                                                                                                                                                                                                  // 2. ピクセルデータを取得し、等圧線（暗い色）を抽出
                                                                                                                                                                                                                                                                                                                                                                                        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                              let data = imageData.data;
                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                          for (let i = 0; i < data.length; i += 4) {
                                                                                                                                                                                                                                                                                                                                                                                                                  const r = data[i];
                                                                                                                                                                                                                                                                                                                                                                                                                          const g = data[i+1];
                                                                                                                                                                                                                                                                                                                                                                                                                                  const b = data[i+2];
                                                                                                                                                                                                                                                                                                                                                                                                                                          // 輝度を計算
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  // 閾値以下の暗いピクセル（線）を抽出、それ以外は白（0）にする
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (brightness < 150) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 線があった場所を黒く残す
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              data[i] = data[i+1] = data[i+2] = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // 背景は白
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          data[i] = data[i+1] = data[i+2] = 255;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ctx.putImageData(imageData, 0, 0);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // 3. 抽出した線に対して強力なぼかし（ブラー）をかけてハイトマップ化する
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const blurValue = document.getElementById('blur-slider').value;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ctx.filter = `blur(${blurValue}px)`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // ぼかすために自分自身を再描画（黒い線の周辺にグレーのグラデーションが広がる）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ctx.drawImage(canvas, 0, 0);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ctx.filter = 'none';

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // 4. ぼかしたピクセルデータからThree.jsの頂点の高さを更新
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    data = imageData.data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const positions = geometry.attributes.position;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const scale = document.getElementById('scale-slider').value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      for (let i = 0; i < positions.count; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // ピクセルインデックス（RGBAなので * 4）
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const r = data[i * 4];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // r値(0=黒/線, 255=白/背景) を高さに変換
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // 白（255）を0基準とし、黒に近いほど高く(または低く)する
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const normalizedHeight = (255 - r) / 255.0; 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      // 高さを適用
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              positions.setZ(i, normalizedHeight * scale);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // ジオメトリの更新を通知し、法線（光の反射用）を再計算
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      positions.needsUpdate = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            geometry.computeVertexNormals();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    // --- 4. イベントリスナー ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById('image-upload').addEventListener('change', (e) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const file = e.target.files[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!file) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const reader = new FileReader();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                reader.onload = (event) => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const img = new Image();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                img.onload = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          currentImage = img;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    processImageToHeightmap();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    img.src = event.target.result;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                reader.readAsDataURL(file);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // スライダー操作時に再計算
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('scale-slider').addEventListener('input', processImageToHeightmap);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('blur-slider').addEventListener('change', processImageToHeightmap); // inputだと重いためchangeイベント

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.addEventListener('resize', () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          camera.aspect = window.innerWidth / window.innerHeight;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                camera.updateProjectionMatrix();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      renderer.setSize(window.innerWidth, window.innerHeight);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              // --- 5. アニメーションループ ---
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function animate() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        requestAnimationFrame(animate);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              controls.update();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    renderer.render(scene, camera);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            animate();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
